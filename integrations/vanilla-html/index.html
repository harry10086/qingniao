<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qingniao (青鸟) 评论系统 - 快速上手演示</title>
  <!-- 引入 Qingniao 样式 -->
  <link rel="stylesheet" href="../../client/qingniao.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f8fafc;
      color: #334155;
    }
    .article-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }
    h1 { margin-top: 0; color: #0f172a; }
  </style>
</head>
<body>

  <div class="article-box">
    <h1>🕊️ 欢迎使用 Qingniao (青鸟) 评论系统</h1>
    <p>这是一个极简、优雅、现代且完全自主可控的无服务器开源评论组件，基于 Cloudflare Workers + D1 + KV 构建。</p>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
    
    <!-- 评论容器 -->
    <div id="qingniao-wrap"></div>
  </div>

  <!-- 引入 Qingniao 客户端脚本 -->
  <script src="../../client/qingniao.js"></script>
  <script>
    Qingniao.init({
      el: '#qingniao-wrap',
      apiUrl: 'https://your-worker.yourname.workers.dev', // 替换为你的 Worker API 域名
      path: location.pathname,
      placeholder: '蓬山此去无多路，青鸟殷勤为探看...',
      maxLength: 500,
      pageSize: 20,
      defaultSort: 'newest',
      adminBadge: '博主',
      masterEmail: 'admin@example.com'
    });
  </script>
</body>
</html>
